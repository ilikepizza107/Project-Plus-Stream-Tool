name: Build GUI

on:
  push:
    paths:
      - "Interface Source Code/package.json"
      - "Interface Source Code/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            electron_target: --win
            artifact_glob: "Interface Source Code/dist/*.exe"

          - platform: macOS
            os: macos-latest
            electron_target: --mac --universal
            artifact_glob: "Interface Source Code/dist/*.app"

          - platform: Linux
            os: ubuntu-24.04
            electron_target: --linux AppImage
            artifact_glob: "Interface Source Code/dist/*.AppImage"

    defaults:
      run:
        working-directory: "Interface Source Code"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: "Interface Source Code/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron application
        run: npx electron-builder ${{ matrix.electron_target }} --publish=never

      - name: Upload ${{ matrix.platform }} build
        uses: actions/upload-artifact@v4
        with:
          name: Project-ST-GUI-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30
